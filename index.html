<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Creative Studio Planning</title>
<style>
:root {
  --bg: #f6f6f4; --panel: #ffffff; --panel-hover: #f0f0ee; --border: #e3e3df;
  --text: #21242b; --text-dim: #6b6f78; --text-faint: #9a9da6;
  --accent: #3b6fe0; --red: #d9534f; --orange: #d99a2a; --green: #3f9d6d;
  --c-taken: #7a6fd9;
  --radius: 10px; --mono: 'SF Mono','IBM Plex Mono',Consolas,monospace; --sans: -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
}
* { box-sizing: border-box; }
html, body { overflow-x: hidden; max-width: 100%; }
body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--sans); -webkit-font-smoothing: antialiased; }
.wrap { max-width: 1180px; margin: 0 auto; padding: 32px 24px 80px; }
header { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 24px; }
header h1 { font-size: 20px; font-weight: 700; letter-spacing: -0.01em; margin: 0; font-family: var(--mono); cursor: pointer; user-select: none; }
header h1:hover { opacity: 0.8; }
header h1 span { color: var(--text-faint); font-weight: 400; }
.header-actions { display: flex; gap: 10px; align-items: center; }
button { font-family: var(--sans); font-size: 13px; font-weight: 600; border-radius: 7px; border: 1px solid var(--border); cursor: pointer; padding: 8px 14px; background: var(--panel); color: var(--text); transition: background 0.15s, border-color 0.15s; }
button:hover { background: var(--panel-hover); border-color: #c9c9c4; }
button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
button.primary:hover { filter: brightness(1.08); }
button.primary:disabled { filter: none; opacity: 0.5; cursor: default; }
button.ghost { background: transparent; border-color: transparent; color: var(--text-dim); padding: 6px 8px; }
button.icon { padding: 5px 9px; font-size: 13px; }
button.small { padding: 5px 10px; font-size: 12px; }
button:disabled { opacity: 0.5; cursor: default; }
.state-msg { color: var(--text-dim); font-size: 13px; padding: 40px 0; text-align: center; }
.state-msg button { margin-top: 10px; }
.hidden { display: none !important; }
.user-badge { font-size: 12px; color: var(--text-dim); font-family: var(--mono); display: flex; align-items: center; gap: 6px; }
.build-tag { position: fixed; bottom: 6px; right: 10px; font-family: var(--mono); font-size: 9px; color: var(--text-faint); opacity: 0.45; pointer-events: none; z-index: 1; }

/* Calendar */
.cal-controls { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
.cal-title { font-size: 22px; font-weight: 700; }
.cal-nav { display: flex; gap: 8px; }
.tl-zoom { display: flex; gap: 2px; background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 2px; }
.tl-zoom button { border: none; background: transparent; padding: 5px 12px; font-size: 12px; border-radius: 6px; }
.tl-zoom button.active { background: var(--accent); color: #fff; }
.cal-grid { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
.cal-weekdays { display: grid; grid-template-columns: repeat(7, 1fr); border-bottom: 1px solid var(--border); }
.cal-weekdays div { padding: 8px; text-align: center; font-size: 11px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.05em; }
.cal-weeks { display: flex; flex-direction: column; }
.cal-week-wrap { border-bottom: 1px solid var(--border); padding-bottom: 8px; }
.cal-week-wrap:last-child { border-bottom: none; }
.cal-daynum-grid { display: grid; grid-template-columns: repeat(7, 1fr); }
.cal-daynum-cell { border-right: 1px solid var(--border); padding: 6px 6px 0; }
.cal-daynum-cell:last-child { border-right: none; }
.cal-daynum-cell.other-month { opacity: 0.35; }
.cal-daynum { font-size: 12px; color: var(--text-dim); font-family: var(--mono); }
.cal-daynum-cell.today .cal-daynum { background: var(--red); color: #fff; border-radius: 50%; width: 20px; height: 20px; display: inline-flex; align-items: center; justify-content: center; }
.cal-band-grid { display: grid; grid-template-columns: repeat(7, 1fr); margin-top: 4px; }
.cal-band { grid-row: 1; height: 15px; border-radius: 4px; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 9px; font-weight: 700; color: #fff; overflow: hidden; }
.cal-single-grid { display: grid; grid-template-columns: repeat(7, 1fr); margin-top: 2px; }
.cal-single-cell { padding: 0 6px; display: flex; flex-direction: column; gap: 2px; }
.cal-chip { font-size: 10px; padding: 2px 5px; border-radius: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; cursor: pointer; color: #fff; font-weight: 600; }
.year-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
@media (max-width: 700px) { .year-grid { grid-template-columns: repeat(2, 1fr); } }
.year-month-card { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); padding: 12px; min-height: 110px; }
.year-month-card.current { border-color: var(--accent); }
.year-month-label { font-size: 12px; font-weight: 700; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.04em; margin-bottom: 8px; }
.year-month-pills { display: flex; flex-direction: column; gap: 3px; }
.year-month-empty { font-size: 11px; color: var(--text-faint); }

/* Home layout */
.home-grid { display: grid; grid-template-columns: 1fr 300px; gap: 20px; align-items: start; margin-top: 20px; }
@media (max-width: 900px) { .home-grid { grid-template-columns: 1fr; } }
.home-sidebar { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
.home-sidebar h3 { margin: 0; padding: 14px 18px; font-size: 13px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text-dim); border-bottom: 1px solid var(--border); }
.sidebar-todo { display: flex; align-items: flex-start; gap: 8px; padding: 10px 16px; border-bottom: 1px solid var(--border); cursor: pointer; font-size: 12px; }
.sidebar-todo:last-child { border-bottom: none; }
.sidebar-todo:hover { background: var(--panel-hover); }
.sidebar-todo.prio-rood { box-shadow: inset 0 0 16px 1px rgba(217,83,79,0.35); background: rgba(217,83,79,0.05); }
.sidebar-todo.prio-oranje { box-shadow: inset 0 0 16px 1px rgba(217,154,42,0.35); background: rgba(217,154,42,0.05); }
.sidebar-todo.prio-groen { box-shadow: inset 0 0 16px 1px rgba(63,157,109,0.35); background: rgba(63,157,109,0.05); }
.sidebar-prio { width: 8px; height: 8px; border-radius: 50%; margin-top: 3px; flex-shrink: 0; background: var(--border); }
.sidebar-prio.rood { background: var(--red); }
.sidebar-prio.oranje { background: var(--orange); }
.sidebar-prio.groen { background: var(--green); }
.sidebar-todo-text { flex: 1; min-width: 0; }
.sidebar-todo-proj { font-size: 10px; color: var(--text-faint); margin-top: 2px; }

.proj-list { margin-top: 28px; background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
.proj-list h3 { margin: 0; padding: 14px 18px; font-size: 13px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text-dim); border-bottom: 1px solid var(--border); }
.proj-row { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; padding: 12px 18px; border-bottom: 1px solid var(--border); cursor: pointer; font-size: 13px; }
.proj-row:last-child { border-bottom: none; }
.proj-row:hover { background: var(--panel-hover); }
.proj-row .dot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }
.proj-row .p-name { font-weight: 600; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; order: 2; flex: 1 1 auto; }
.proj-row .p-owner { color: var(--text-dim); font-size: 11px; order: 5; }
.proj-row .p-period { color: var(--text-dim); font-family: var(--mono); font-size: 12px; order: 4; flex-basis: 100%; }
.proj-row .p-status { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; padding: 3px 8px; border-radius: 20px; white-space: nowrap; order: 6; }
.status-in_productie { background: rgba(59,111,224,0.12); color: var(--accent); }
.status-live { background: rgba(63,157,109,0.12); color: var(--green); }
.status-ongoing { background: rgba(139,111,217,0.14); color: var(--c-taken); }
.member-filter-row { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
.member-chip { border: 1.5px solid var(--chip-color); background: var(--chip-color); color: #fff; font-size: 11px; font-weight: 600; padding: 4px 10px; border-radius: 20px; cursor: pointer; transition: opacity 0.15s, background 0.15s, color 0.15s; }
.member-chip.off { background: transparent; color: var(--text-faint); opacity: 0.6; }
.status-archived { background: rgba(154,157,166,0.18); color: var(--text-faint); }
.p-countdown { font-family: var(--mono); font-size: 12px; color: var(--text-dim); white-space: nowrap; order: 7; margin-left: auto; }
.p-countdown.soon { color: var(--orange); font-weight: 700; }
.p-countdown.overdue { color: var(--red); font-weight: 700; }
.proj-row-delete { opacity: 0; border: none; background: none; color: var(--text-faint); font-size: 15px; padding: 2px 6px; order: 3; }
.proj-row:hover .proj-row-delete { opacity: 1; }
.proj-row-delete:hover { color: var(--red); }

/* Detail header / timeline */
.detail-header { display: flex; align-items: flex-start; gap: 12px; margin-bottom: 20px; justify-content: space-between; }
.detail-header-left { display: flex; align-items: center; gap: 12px; }
.back-btn { font-family: var(--mono); font-size: 12px; }
.detail-title-row { display: flex; align-items: center; gap: 8px; }
.detail-title { font-size: 22px; font-weight: 700; margin: 0; }
.detail-sub { font-size: 12px; color: var(--text-dim); font-family: var(--mono); margin-top: 2px; }
.edit-project-btn { font-size: 13px; opacity: 0.6; }
.edit-project-btn:hover { opacity: 1; }
.share-project-btn { font-size: 12px; font-weight: 600; display: inline-flex; align-items: center; gap: 5px; }
.share-link-box { display: flex; gap: 8px; margin-top: 6px; }
.share-link-box input { flex: 1; background: var(--bg); border: 1px solid var(--border); border-radius: 7px; color: var(--text-dim); padding: 8px 10px; font-size: 12px; font-family: var(--mono); }
.countdown-badge { font-family: var(--mono); font-size: 12px; color: #a34d3f; background: var(--panel); border: 1px solid var(--border); border-radius: 20px; padding: 5px 12px; white-space: nowrap; }
.detail-header-right { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }

.tl-controls { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; gap: 12px; flex-wrap: wrap; }
.tl-nav { display: flex; align-items: center; gap: 8px; }
.tl-nav .tl-label { font-size: 13px; font-family: var(--mono); color: var(--text-dim); min-width: 140px; text-align: center; }
.timeline { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; padding: 14px 18px; }
.plan-daynums { display: flex; margin-left: 148px; margin-bottom: 6px; }
.plan-daynums span { flex: 1; text-align: center; font-size: 10px; color: var(--text-faint); font-family: var(--mono); }
.plan-daynums span.today { color: var(--red); font-weight: 700; }
.plan-rows { display: flex; flex-direction: column; }
.plan-row { display: flex; align-items: center; gap: 10px; padding: 6px 0; border-bottom: 1px solid var(--border); }
.plan-row:last-child { border-bottom: none; }
.plan-label { width: 138px; flex-shrink: 0; display: flex; align-items: center; gap: 6px; font-size: 12px; overflow: hidden; }
.plan-label span:last-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.plan-track { flex: 1; position: relative; height: 14px; background: var(--bg); border-radius: 4px; }
.plan-bar { position: absolute; top: 0; bottom: 0; border-radius: 4px; cursor: pointer; min-width: 4px; }
.tlcal-daynums { display: flex; margin-left: 112px; margin-bottom: 4px; }
.tlcal-daynums span { flex: 1; text-align: center; font-size: 10px; color: var(--text-faint); font-family: var(--mono); }
.tlcal-row { display: flex; align-items: center; gap: 10px; }
.tlcal-rowlabel { width: 100px; flex-shrink: 0; font-size: 12px; font-weight: 600; display: flex; align-items: center; gap: 6px; }
.tlcal-track { position: relative; flex: 1; height: 30px; background: var(--bg); border-radius: 6px; }
.tlcal-bar { position: absolute; top: 4px; bottom: 4px; border-radius: 6px; display: flex; align-items: center; padding: 0 8px; color: #fff; font-size: 11px; font-weight: 600; overflow: hidden; white-space: nowrap; cursor: default; }
.tlcal-break { position: absolute; top: -5px; bottom: -5px; width: 2px; background: rgba(0,0,0,0.45); cursor: help; }
.tlcal-today { position: absolute; top: -6px; bottom: -6px; width: 2px; background: var(--red); z-index: 3; }

.project-concept { margin: 18px 0; }
.project-concept label { display: block; font-size: 11px; color: var(--text-faint); margin-bottom: 5px; text-transform: uppercase; letter-spacing: 0.05em; }
.project-concept textarea { width: 100%; min-height: 70px; background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); color: var(--text); padding: 10px 12px; font-family: var(--sans); font-size: 13px; resize: vertical; }

.tracks { display: flex; align-items: flex-start; gap: 16px; margin: 24px 0 28px; max-width: 1180px; }
.tracks-lists { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px; flex: 1; min-width: 0; align-items: start; }
.tracks-files { width: 280px; flex-shrink: 0; }
.track-col { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; display: flex; flex-direction: column; }
.track-head { padding: 12px 16px; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.add-track-btn { border: 1.5px dashed var(--border); background: transparent; border-radius: 50%; width: 20px; height: 20px; display: flex; align-items: center; justify-content: center; color: var(--text-faint); font-size: 13px; line-height: 1; cursor: pointer; flex-shrink: 0; }
.add-track-btn:hover { border-color: var(--accent); color: var(--accent); }
.file-list { display: flex; flex-direction: column; }
.file-row { padding: 9px 12px; border-bottom: 1px solid var(--border); font-size: 13px; display: flex; align-items: center; gap: 8px; }
.file-row:last-child { border-bottom: none; }
.file-row-main { flex: 1; min-width: 0; }
.file-row-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; cursor: pointer; color: var(--accent); }
.file-row-name:hover { text-decoration: underline; }
.file-row-meta { font-size: 11px; color: var(--text-faint); margin-top: 2px; }
.file-row-delete { border: none; background: transparent; color: var(--text-faint); font-size: 15px; padding: 2px 6px; cursor: pointer; flex-shrink: 0; }
.file-row-delete:hover { color: var(--red); }
.file-drop-row { padding: 10px 12px; }
.file-drop-row input[type="file"] { display: none; }
.file-drop-label { display: block; text-align: center; padding: 10px; border: 1.5px dashed var(--border); border-radius: 7px; font-size: 12px; color: var(--text-dim); cursor: pointer; }
.file-drop-label:hover { border-color: var(--accent); color: var(--accent); }
.file-drop-label.drag-active { border-color: var(--accent); color: var(--accent); background: rgba(59,111,224,0.06); }
.file-label { display: inline-block; background: var(--accent); color: #fff; font-size: 10px; font-weight: 700; padding: 1px 6px; border-radius: 10px; margin-right: 4px; text-transform: uppercase; letter-spacing: 0.03em; }
.file-empty { padding: 20px 16px; text-align: center; color: var(--text-faint); font-size: 12px; }
.track-head-left { display: flex; align-items: center; gap: 8px; }
.dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
.step-list { display: flex; flex-direction: column; }
.step { padding: 9px 12px; border-bottom: 1px solid var(--border); font-size: 13px; display: flex; align-items: flex-start; gap: 8px; cursor: grab; transition: opacity 0.22s ease, transform 0.22s ease; position: relative; }
.step:last-child { border-bottom: none; }
.step.dragging { opacity: 0.4; }
.step.drag-over { border-top: 2px solid var(--accent); }
.step.fading { opacity: 0 !important; transform: translateY(6px); }
.step.prio-rood { box-shadow: inset 0 0 16px 1px rgba(217,83,79,0.4); background: rgba(217,83,79,0.05); }
.step.prio-oranje { box-shadow: inset 0 0 16px 1px rgba(217,154,42,0.4); background: rgba(217,154,42,0.05); }
.step.prio-groen { box-shadow: inset 0 0 16px 1px rgba(63,157,109,0.4); background: rgba(63,157,109,0.05); }
.step.done.prio-rood, .step.done.prio-oranje, .step.done.prio-groen { box-shadow: none; background: transparent; }
.step-check { width: 16px; height: 16px; border-radius: 4px; border: 1.5px solid var(--text-faint); flex-shrink: 0; margin-top: 1px; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 10px; transition: all 0.12s; }
.step.done .step-check { background: var(--green); border-color: var(--green); color: #fff; }
.step-main { flex: 1; min-width: 0; }
.step-name { line-height: 1.4; }
.step-name[contenteditable="true"] { outline: 1px dashed var(--accent); border-radius: 3px; padding: 0 2px; }
.step.done .step-name { color: var(--text-dim); text-decoration: line-through; text-decoration-color: var(--text-faint); }
.step-due { font-size: 11px; color: var(--text-faint); font-family: var(--mono); margin-top: 2px; }
.step-assignee { font-size: 11px; color: var(--accent); margin-top: 2px; font-weight: 600; }
.step-note-text { font-size: 12px; color: var(--text-dim); margin-top: 4px; cursor: pointer; }
.step-url { font-size: 12px; margin-top: 4px; }
.step-url a { color: var(--accent); text-decoration: none; }
.step-url a:hover { text-decoration: underline; }
.prio-flag { border: none; background: transparent; font-size: 15px; line-height: 1; padding: 2px 4px; cursor: pointer; color: var(--text-faint); opacity: 0.6; }
.prio-flag:hover { opacity: 1; }
.prio-flag.prio-none { color: var(--text-faint); }
.prio-flag.prio-rood { color: var(--red); opacity: 1; }
.prio-flag.prio-oranje { color: var(--orange); opacity: 1; }
.prio-flag.prio-groen { color: var(--green); opacity: 1; }
.step-actions { display: flex; gap: 0px; opacity: 0; transition: opacity 0.15s ease, transform 0.15s ease; position: absolute; right: 8px; top: 50%; transform: translateY(-50%) translateX(6px); background: var(--panel); border-radius: 8px; box-shadow: -10px 0 12px -4px rgba(0,0,0,0.08), 0 1px 5px rgba(0,0,0,0.1); padding: 2px 3px; pointer-events: none; }
.step:hover .step-actions { opacity: 1; transform: translateY(-50%) translateX(0); pointer-events: auto; }
.step-actions button { border: none; background: transparent; padding: 3px 4px; font-size: 11px; color: var(--text-faint); }
.step-actions button:hover { color: var(--text); }
.step-actions button.has-note { color: var(--accent); }
.add-step-row { display: flex; gap: 8px; padding: 10px 12px; }
.add-step-row input { flex: 1; background: var(--bg); border: 1px solid var(--border); border-radius: 7px; color: var(--text); padding: 7px 10px; font-size: 12px; }

/* Modal */
.modal-backdrop { position: fixed; inset: 0; background: rgba(20,22,26,0.35); display: flex; align-items: center; justify-content: center; z-index: 100; padding: 20px; }
.modal { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); padding: 22px; max-width: 480px; width: 100%; max-height: 86vh; overflow-y: auto; box-shadow: 0 12px 40px rgba(0,0,0,0.18); }
.modal h2 { margin: 0 0 4px; font-size: 17px; }
.modal .hint { font-size: 12px; color: var(--text-dim); margin-bottom: 14px; line-height: 1.5; }
.field { margin-bottom: 12px; }
.field label { display: block; font-size: 11px; color: var(--text-faint); margin-bottom: 5px; text-transform: uppercase; letter-spacing: 0.05em; }
.field input, .field textarea, .field select { width: 100%; background: var(--bg); border: 1px solid var(--border); border-radius: 7px; color: var(--text); padding: 8px 10px; font-size: 13px; font-family: var(--sans); }
.field textarea { min-height: 70px; resize: vertical; }
.date-input-row { display: flex; gap: 6px; align-items: center; }
.native-date-hidden { position: absolute; opacity: 0; width: 1px; height: 1px; pointer-events: none; }
.date-pick-btn { flex-shrink: 0; padding: 7px 9px; }
.modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; }
.color-swatch-row { display: flex; gap: 6px; flex-wrap: wrap; }
.color-swatch { width: 22px; height: 22px; border-radius: 50%; cursor: pointer; border: 2px solid transparent; }
.color-swatch.selected { border-color: var(--text); }

@media (max-width: 640px) {
  .wrap { padding: 20px 14px 60px; }
  header { flex-wrap: wrap; gap: 10px; }
  .home-grid { grid-template-columns: 1fr; }
  .cal-grid { overflow-x: auto; -webkit-overflow-scrolling: touch; }
  .tracks { max-width: 100%; flex-direction: column; }
  .tracks-files { width: 100%; }
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1 id="homeLink">Creative Studio <span>planning</span></h1>
    <div class="header-actions">
      <span class="user-badge" id="userBadge"></span>
      <button class="ghost small hidden" id="viewPrefsBtn" title="Kies wie en welke kleuren je op je eigen kalender ziet">&#128065; Weergave</button>
      <button class="ghost small hidden" id="archiveBtn">&#128451; Archief</button>
      <button class="ghost small hidden" id="settingsBtn">&#9881; Team</button>
      <button class="ghost small" id="authBtn">Inloggen</button>
      <button class="primary" id="newProjectBtn">+ Nieuw project</button>
    </div>

  if (!m) return null;
  const day = Number(m[1]), month = Number(m[2]), year = Number(m[3]);
  const d = new Date(year, month - 1, day);
  if (d.getFullYear() !== year || d.getMonth() !== month - 1 || d.getDate() !== day) return null;
  return d;
}

// ================= Calendar (reused pattern) =================
const calState = { anchor: new Date(), mode: 'maand' };
function startOfMonth(d) { return new Date(d.getFullYear(), d.getMonth(), 1); }
function isSameDay(a, b) { return a.getFullYear()===b.getFullYear() && a.getMonth()===b.getMonth() && a.getDate()===b.getDate(); }
function calItemOnclick(item) {
  if (item.external) return `window.open('${item.url}','_blank')`;
  return `openProject('${item.id}')`;

function computeWeekBands(week, projects) {
  const candidates = [];
  projects.forEach(p => {
    const isOngoing = p.status === 'ongoing';
    const start = p.start_date ? new Date(p.start_date) : null;
    const launch = isOngoing ? week[6] : (p.launch_date ? new Date(p.launch_date) : null);
    if (!start || !launch || (!isOngoing && isSameDay(start, launch))) return;
    if (launch < week[0] || start > week[6]) return;
    const segStart = start < week[0] ? week[0] : start;
    const segEnd = launch > week[6] ? week[6] : launch;
    const colStart = week.findIndex(d => isSameDay(d, segStart));
    const colEnd = week.findIndex(d => isSameDay(d, segEnd));
    if (colStart === -1 || colEnd === -1) return;
    let label = p.name;
    if (!isOngoing) {
      if (isSameDay(segStart, start)) label = '\u25B6 ' + label;
      if (p.launch_date && isSameDay(segEnd, new Date(p.launch_date))) label = label + ' \u{1F3C1}';
    }
    if (p.external) label = '\u{1F517} ' + label;
    const initial = p.name.trim().charAt(0).toUpperCase();
    candidates.push({ colStart, colEnd, label, initial, color: getEffectiveColor(p), id: p.id, ongoing: isOngoing, external: !!p.external, url: p.url });
  });
  const rows = [];
  candidates.forEach(c => {
    const row = rows.find(r => r.every(item => c.colEnd < item.colStart || c.colStart > item.colEnd));
    if (row) row.push(c); else rows.push([c]);
  });
  return rows;
}
function singleDayItemsForDay(day, projects) {
  const items = [];
  projects.forEach(p => {
    if (p.status === 'ongoing') return;
    const start = p.start_date ? new Date(p.start_date) : null;
    const launch = p.launch_date ? new Date(p.launch_date) : null;
    const color = getEffectiveColor(p);
    if (start && launch && isSameDay(start, launch) && isSameDay(day, start)) items.push({label: '\u25B6\u{1F3C1} ' + p.name, color, id: p.id, external: !!p.external, url: p.url});
    else if (start && !launch && isSameDay(start, day)) items.push({label: '\u25B6 ' + p.name, color, id: p.id, external: !!p.external, url: p.url});
    else if (launch && !start && isSameDay(launch, day)) items.push({label: '\u{1F3C1} ' + p.name, color, id: p.id, external: !!p.external, url: p.url});
  });
  return items;
}

  if (calState.mode === 'jaar') renderYearCalendar(containerId, projects);
  else if (calState.mode === 'planning') renderPlanningView(containerId, projects);

function renderYearCalendar(containerId, projects) {
  const container = document.getElementById(containerId);
  const year = calState.anchor.getFullYear();
  const today = new Date();
  const months = [];
  for (let m = 0; m < 12; m++) {
    const monthStart = new Date(year, m, 1);
    const monthEnd = new Date(year, m+1, 0);
    const active = projects.filter(p => {
      const s = p.start_date ? new Date(p.start_date) : null;
      if (!s) return false;
      const end = p.status === 'ongoing' ? monthEnd : (p.launch_date ? new Date(p.launch_date) : s);
      return end >= monthStart && s <= monthEnd;
    });
    months.push({ label: monthStart.toLocaleDateString('nl-NL',{month:'long'}), monthStart, active });
  }
  const monthCardHtml = (m) => {
    const isCurrent = today.getFullYear()===year && today.getMonth()===m.monthStart.getMonth();
    const shown = m.active.slice(0,5);
    const extra = m.active.length - shown.length;
    return `<div class="year-month-card ${isCurrent?'current':''}">
      <div class="year-month-label">${m.label.charAt(0).toUpperCase()+m.label.slice(1)}</div>
      <div class="year-month-pills">
        ${shown.map(p => `<div class="cal-chip" style="${p.status==='ongoing' ? `background:transparent;border:1.5px solid ${getEffectiveColor(p)};color:${getEffectiveColor(p)};` : `background:${getEffectiveColor(p)};`}" onclick="${calItemOnclick(p)}" title="${escapeHtml(p.name)}">${p.external?'\u{1F517} ':''}${escapeHtml(p.name)}</div>`).join('')}
        ${extra > 0 ? `<div class="cal-chip more">+${extra} meer</div>` : ''}
        ${!m.active.length ? '<div class="year-month-empty">\u2014</div>' : ''}
      </div>
    </div>`;
  };
  container.innerHTML = `
    <div class="cal-controls">
      <div class="cal-title">${year}</div>
      <div class="cal-nav">${calModeToggleHtml()}<button class="icon" id="calPrev">\u2190</button><button class="small" id="calToday">Vandaag</button><button class="icon" id="calNext">\u2192</button></div>
    </div>
    <div class="year-grid">${months.map(monthCardHtml).join('')}</div>
  `;
  wireCalControls(containerId, projects);
}
function renderMonthCalendar(containerId, projects) {
  const container = document.getElementById(containerId);
  const anchor = calState.anchor;
  const monthStart = startOfMonth(anchor);
  const gridStart = new Date(monthStart);
  gridStart.setDate(gridStart.getDate() - ((monthStart.getDay()+6)%7));
  const today = new Date();
  const weeks = [];
  let cur = new Date(gridStart);
  for (let w = 0; w < 6; w++) {
    const days = []; for (let d = 0; d < 7; d++) { days.push(new Date(cur)); cur.setDate(cur.getDate()+1); }
    weeks.push(days);
    if (cur > monthStart && cur.getMonth() !== monthStart.getMonth() && w >= 4) break;
  }
  const weekHtml = (week) => {
    const daynumCells = week.map(day => {
      const inMonth = day.getMonth() === monthStart.getMonth();
      const isToday = isSameDay(day, today);
      return `<div class="cal-daynum-cell ${inMonth?'':'other-month'} ${isToday?'today':''}"><span class="cal-daynum">${day.getDate()}</span></div>`;
    }).join('');
    const bandRows = computeWeekBands(week, projects);
    const bandRowsHtml = bandRows.map(row => `
      <div class="cal-band-grid">
        ${row.map(b => `<div class="cal-band" style="${b.ongoing ? `background:repeating-linear-gradient(90deg, ${b.color} 0 6px, ${b.color}99 6px 10px);` : `background:${b.color};`}grid-column:${b.colStart+1} / ${b.colEnd+2}" onclick="${calItemOnclick(b)}" title="${escapeHtml(b.label)}">${b.external ? '\u{1F517}' : b.initial}</div>`).join('')}
      </div>
    `).join('');
    const singleCells = week.map(day => {
      const items = singleDayItemsForDay(day, projects);
      const shown = items.slice(0,2);
      const extra = items.length - shown.length;
      return `<div class="cal-single-cell">
        ${shown.map(e => `<div class="cal-chip" style="background:${e.color}" onclick="${calItemOnclick(e)}" title="${escapeHtml(e.label)}">${escapeHtml(e.label)}</div>`).join('')}
        ${extra > 0 ? `<div class="cal-chip more" style="background:transparent;color:var(--text-faint);">+${extra} meer</div>` : ''}
      </div>`;
    }).join('');
    return `<div class="cal-week-wrap">

      ${bandRowsHtml}
      <div class="cal-single-grid">${singleCells}</div>
    </div>`;

      <div class="cal-weeks">${weeks.map(weekHtml).join('')}</div>
    </div>

function computeBarRange(p, monthStart, monthEnd) {
  const isOngoing = p.status === 'ongoing';
  const start = p.start_date ? new Date(p.start_date) : null;
  if (!start) return null;
  const end = isOngoing ? monthEnd : (p.launch_date ? new Date(p.launch_date) : start);
  const segStart = start < monthStart ? monthStart : start;
  const segEnd = end > monthEnd ? monthEnd : end;
  if (segEnd < monthStart || segStart > monthEnd) return null;
  const startDay = segStart.getDate();
  const endDay = Math.max(startDay, segEnd.getDate());
  return { startDay, endDay, isOngoing };
}
function renderPlanningView(containerId, projects) {
  const container = document.getElementById(containerId);
  const anchor = calState.anchor;
  const monthStart = startOfMonth(anchor);
  const monthEnd = new Date(anchor.getFullYear(), anchor.getMonth()+1, 0);
  const daysInMonth = monthEnd.getDate();
  const today = new Date();
  const todayInMonth = today.getFullYear()===anchor.getFullYear() && today.getMonth()===anchor.getMonth();

  const rows = projects.map(p => {
    const range = computeBarRange(p, monthStart, monthEnd);
    return range ? { p, range } : null;
  }).filter(Boolean);

  const dayNumsHtml = Array.from({ length: daysInMonth }, (_, i) => {
    const isToday = todayInMonth && (i + 1) === today.getDate();
    return `<span class="${isToday?'today':''}">${i + 1}</span>`;
  }).join('');

  const rowsHtml = rows.length ? rows.map(({ p, range }) => {
    const color = getEffectiveColor(p);
    const left = ((range.startDay - 1) / daysInMonth) * 100;
    const width = Math.max(((range.endDay - range.startDay + 1) / daysInMonth) * 100, (1 / daysInMonth) * 100);
    return `<div class="plan-row">
        <div class="plan-label"><span class="dot" style="background:${color}"></span><span>${p.external ? '\u{1F517} ' : ''}${escapeHtml(p.name)}</span></div>
        <div class="plan-track">
          <div class="plan-bar" style="left:${left}%;width:${width}%;${range.isOngoing ? `background:repeating-linear-gradient(90deg, ${color} 0 6px, ${color}99 6px 10px);` : `background:${color};`}" onclick="${calItemOnclick(p)}" title="${escapeHtml(p.name)}"></div>
        </div>
      </div>`;
  }).join('') : '<div class="state-msg" style="padding:20px;">Geen projecten deze maand.</div>';

  const monthLabel = anchor.toLocaleDateString('nl-NL', { month: 'long', year: 'numeric' });
  container.innerHTML = `
    <div class="cal-controls">
      <div class="cal-title">${monthLabel.charAt(0).toUpperCase() + monthLabel.slice(1)}</div>
      <div class="cal-nav">${calModeToggleHtml()}<button class="icon" id="calPrev">\u2190</button><button class="small" id="calToday">Vandaag</button><button class="icon" id="calNext">\u2192</button></div>
    </div>
    <div class="timeline">
      <div class="plan-daynums">${dayNumsHtml}</div>
      <div class="plan-rows">${rowsHtml}</div>
    </div>
  `;
  wireCalControls(containerId, projects);
}

async function loadSidebarTodos(projects) {
  const sidebar = document.getElementById('homeSidebar');
  const isMod = currentIsModerator();
  const title = (isLoggedIn && !isMod) ? 'Mijn openstaande taken' : 'Openstaande taken';
  if (!projects.length) { sidebar.innerHTML = `<h3>${title}</h3><div class="state-msg" style="padding:20px;">Niets openstaand.</div>`; return; }
  try {
    const projectMap = {}; projects.forEach(p => projectMap[p.id] = p);
    const steps = await sbSelect('team_project_steps', 'status=neq.done&select=id,project_id,step_name,priority,order_num,assignee_email&order=order_num.asc');
    let relevant = steps.filter(s => projectMap[s.project_id]);
    if (isLoggedIn && !isMod) relevant = relevant.filter(s => s.assignee_email === currentUserEmail);

    const launchTime = (projectId) => {
      const p = projectMap[projectId];
      return (p && p.launch_date) ? new Date(p.launch_date).getTime() : Infinity;
    };
    const prioRank = { rood: 0, oranje: 1, groen: 2 };
    const sorted = relevant.slice().sort((a,b) => (prioRank[a.priority]??3) - (prioRank[b.priority]??3) || launchTime(a.project_id) - launchTime(b.project_id));

    if (!sorted.length) { sidebar.innerHTML = `<h3>${title}</h3><div class="state-msg" style="padding:20px;">Niets openstaand.</div>`; return; }
    sidebar.innerHTML = `<h3>${title}</h3>${sorted.slice(0,25).map(s => {
      const proj = projectMap[s.project_id];
      return `<div class="sidebar-todo prio-${s.priority||'none'}" onclick="openProject('${s.project_id}')">
        <span class="sidebar-prio ${s.priority||'none'}"></span>
        <div class="sidebar-todo-text">${escapeHtml(s.step_name)}${(isMod && s.assignee_email) ? `<div class="sidebar-todo-proj" style="color:${memberColor(s.assignee_email)}">\u{1F464} ${escapeHtml(memberName(s.assignee_email))}</div>` : ''}<div class="sidebar-todo-proj" style="color:${getEffectiveColor(proj)}">${escapeHtml(proj.name)}</div></div>
      </div>`;
    }).join('')}`;
  } catch (e) {
    sidebar.innerHTML = `<h3>${title}</h3><div class="state-msg">Kon niet laden.</div>`;
  }
}

  view.classList.remove('hidden');
  view.innerHTML = '<div class="state-msg">Laden\u2026</div>';
  let p, steps, files;
  try {
    [p, steps, files] = await Promise.all([
      sbSelect('team_projects', 'id=eq.' + projectId + '&select=*').then(r => r[0]),
      sbSelect('team_project_steps', 'project_id=eq.' + projectId + '&select=*&order=order_num.asc'),
      isShared ? Promise.resolve([]) : sbSelect('project_files', 'project_id=eq.' + projectId + '&select=*&order=created_at.desc').catch(() => [])
    ]);

        ${extraTracks.map((t, i) => trackColHtml(p, t.id, t.name, steps.filter(s => s.track === t.id), isShared, true, i === extraTracks.length - 1)).join('')}

function handleFileDrop(event, projectId) {
  event.preventDefault();
  event.currentTarget.classList.remove('drag-active');
  if (!requireLogin()) return;
  const file = event.dataTransfer.files && event.dataTransfer.files[0];
  if (file) startFileUpload(projectId, file);
}
async function startFileUpload(projectId, file) {
  if (!requireLogin()) return;
  const label = prompt('Wat voor bestand is dit? (bijv. Brandbook, Script, Draaiboek \u2014 mag leeg blijven)', '');
  if (label === null) return;
  const dropLabel = document.getElementById('fileDropLabel_' + projectId);
  const originalText = dropLabel ? dropLabel.innerHTML : null;
  if (dropLabel) dropLabel.textContent = 'Bezig met uploaden\u2026';
  try {
    const safeName = file.name.replace(/[^a-zA-Z0-9._-]/g, '_');
    const path = projectId + '/' + Date.now() + '_' + safeName;
    const { error: upErr } = await authClient.storage.from('project-files').upload(path, file);
    if (upErr) throw upErr;
    const row = { id: uid('file'), project_id: projectId, file_name: file.name, storage_path: path, size_bytes: file.size, uploaded_by: currentUserEmail, label: label.trim() || null };
    try {
      await sbInsert('project_files', [row]);
    } catch (insertErr) {
      if (/label/i.test(insertErr.message)) {
        delete row.label;
        await sbInsert('project_files', [row]);
      } else {
        throw insertErr;
      }
    }
    refreshProjectView(projectId);
  } catch (e) {
    alert('Uploaden mislukt: ' + e.message);
    if (dropLabel && originalText) dropLabel.innerHTML = originalText;
  }
}
async function openProjectFile(storagePath) {
  try {
    const { data, error } = await authClient.storage.from('project-files').createSignedUrl(storagePath, 3600);
    if (error) throw error;
    window.open(data.signedUrl, '_blank');
  } catch (e) {
    alert('Kon bestand niet openen: ' + e.message);
  }
}
async function deleteProjectFile(fileId, storagePath, projectId) {
  if (!requireLogin()) return;
  if (!confirm('Dit bestand verwijderen?')) return;
  try {
    await authClient.storage.from('project-files').remove([storagePath]);
    await sbDelete('project_files', 'id=eq.' + fileId);
    refreshProjectView(projectId);
  } catch (e) { alert('Verwijderen mislukt: ' + e.message); }
}

// ---- Calendar-style timeline: month view with a progress bar + deadline breaks ----
const tlState = { anchor: null };
function renderDetailTimeline(p, steps) {
  const el = document.getElementById('detailTimeline');
  if (!p.start_date && !p.launch_date) { el.innerHTML = ''; return; }
  tlState.anchor = p.start_date ? new Date(p.start_date) : new Date();
  renderTimelineMonth(p, steps);
}
function renderTimelineMonth(p, steps) {
  const el = document.getElementById('detailTimeline');
  const anchor = tlState.anchor;
  const monthStart = new Date(anchor.getFullYear(), anchor.getMonth(), 1);
  const monthEnd = new Date(anchor.getFullYear(), anchor.getMonth() + 1, 0);
  const daysInMonth = monthEnd.getDate();
  const today = new Date();

  const isOngoing = p.status === 'ongoing';
  const start = p.start_date ? new Date(p.start_date) : null;
  const end = isOngoing ? monthEnd : (p.launch_date ? new Date(p.launch_date) : null);

  let barStartDay = null, barEndDay = null;
  if (start && end) {
    const segStart = start < monthStart ? monthStart : start;
    const segEnd = end > monthEnd ? monthEnd : end;
    if (segEnd >= monthStart && segStart <= monthEnd) {
      barStartDay = segStart.getDate();
      barEndDay = segEnd.getDate();
    }
  }

  const doneCount = steps.filter(s => s.status === 'done').length;
  const totalCount = steps.length;

  const deadlineDays = steps.filter(s => s.due_date).map(s => {
    const d = new Date(s.due_date);
    return { day: d.getDate(), inMonth: d.getFullYear() === anchor.getFullYear() && d.getMonth() === anchor.getMonth(), label: s.step_name };
  }).filter(m => m.inMonth);

  const todayInMonth = today.getFullYear() === anchor.getFullYear() && today.getMonth() === anchor.getMonth();

  const dayNumsHtml = Array.from({ length: daysInMonth }, (_, i) => `<span>${i + 1}</span>`).join('');

  const barHtml = (barStartDay && barEndDay) ? `
    <div class="tlcal-bar" style="left:${((barStartDay - 1) / daysInMonth) * 100}%; width:${((barEndDay - barStartDay + 1) / daysInMonth) * 100}%; ${isOngoing ? `background:var(--panel);border:1.5px solid ${p.color};color:${p.color};` : `background:${p.color};`}">
      <span>${doneCount}/${totalCount} klaar</span>
      ${deadlineDays.map(m => `<div class="tlcal-break" style="left:${((m.day - barStartDay) / (barEndDay - barStartDay + 1)) * 100}%" title="${escapeHtml(m.label)}"></div>`).join('')}
    </div>` : '';

  const todayLineHtml = todayInMonth ? `<div class="tlcal-today" style="left:${((today.getDate() - 0.5) / daysInMonth) * 100}%" title="Vandaag"></div>` : '';

  const monthLabel = anchor.toLocaleDateString('nl-NL', { month: 'long', year: 'numeric' });

  el.innerHTML = `
    <div class="tl-controls">
      <div class="tl-zoom"><button class="active">Maand</button></div>
      <div class="tl-nav">
        <button class="icon" id="tlPrev">\u2190</button>
        <span class="tl-label">${monthLabel.charAt(0).toUpperCase() + monthLabel.slice(1)}</span>
        <button class="icon" id="tlNext">\u2192</button>
        <button class="small" id="tlToday">Vandaag</button>
      </div>
    </div>
    <div class="timeline">
      <div class="tlcal-daynums">${dayNumsHtml}</div>
      <div class="tlcal-row">
        <div class="tlcal-rowlabel"><span class="dot" style="background:${p.color}"></span> Taken</div>
        <div class="tlcal-track">${todayLineHtml}${barHtml}</div>
      </div>
    </div>
  `;
  document.getElementById('tlPrev').onclick = () => { tlState.anchor = new Date(anchor.getFullYear(), anchor.getMonth() - 1, 1); renderTimelineMonth(p, steps); };
  document.getElementById('tlNext').onclick = () => { tlState.anchor = new Date(anchor.getFullYear(), anchor.getMonth() + 1, 1); renderTimelineMonth(p, steps); };
  document.getElementById('tlToday').onclick = () => { tlState.anchor = new Date(); renderTimelineMonth(p, steps); };
}

function stepHtml(projectId, s, readOnly, ownerEmail) {
  const cls = s.status === 'done' ? 'done' : 'active';
  const subtasks = Array.isArray(s.subtasks) ? s.subtasks : [];
  const prio = s.priority || '';
  const assigneeIsOther = !!(s.assignee_email && s.assignee_email !== ownerEmail);
  const borderStyle = assigneeIsOther ? ` style="border:2px solid ${memberColor(s.assignee_email)};"` : '';
  return `
    <div class="step ${cls} prio-${prio||'none'}" draggable="${!readOnly}" data-step-id="${s.id}"${borderStyle}>
      <div class="step-check" ${readOnly?'':`onclick="toggleStep('${projectId}','${s.id}',${s.status === 'done'})"`}>${s.status === 'done' ? '\u2713' : ''}</div>
      <div class="step-main">
        <div class="step-name" id="stepname_${s.id}">${escapeHtml(s.step_name)}</div>
        ${s.due_date ? `<div class="step-due">${fmtDate(s.due_date)}</div>` : ''}
        ${s.assignee_email ? `<div class="step-assignee" style="color:${memberColor(s.assignee_email)}">\u{1F464} ${escapeHtml(memberName(s.assignee_email))}</div>` : ''}
        ${s.note ? `<div class="step-note-text" onclick="${readOnly?'':`startEditNote('${s.id}')`}">${escapeHtml(s.note)}</div>` : ''}
        ${s.url ? `<div class="step-url"><a href="${escapeHtml(s.url)}" target="_blank" rel="noopener">\u{1F517} ${escapeHtml(s.url.replace(/^https?:\/\//,''))}</a></div>` : ''}
      </div>
      ${readOnly ? '' : `
      <button class="prio-flag prio-${prio||'none'}" title="Prioriteit instellen" onclick="cyclePriority('${projectId}','${s.id}','${prio}')">\u2691</button>
      <div class="step-actions">
        <button title="Toewijzen" onclick="assignStepUI('${projectId}','${s.id}','${escapeHtml(s.assignee_email||'').replace(/'/g,"&#39;")}','${escapeHtml(ownerEmail||'').replace(/'/g,"&#39;")}')">\u{1F464}</button>
        <button title="Deadline" onclick="setStepDeadlineUI('${projectId}','${s.id}','${escapeHtml(isoToDutch(s.due_date))}')">\u{1F4C5}</button>
        <button title="URL" onclick="setStepUrlUI('${projectId}','${s.id}','${escapeHtml(s.url||'').replace(/'/g,"&#39;")}')">\u{1F517}</button>
        <button title="Notitie" onclick="startEditNote('${s.id}')">\u{1F4DD}</button>
        <button title="Naam aanpassen" onclick="startRenameStep('${s.id}')">\u270e</button>
        <button title="Verwijderen" onclick="deleteStepUI('${projectId}','${s.id}')">\u00d7</button>
      </div>`}
    </div>
  `;
}

async function cyclePriority(projectId, stepId, current) {
  if (!requireLogin()) return;
  const order = ['', 'rood', 'oranje', 'groen'];
  const next = order[(order.indexOf(current) + 1) % order.length];
  await sbUpdate('team_project_steps', 'id=eq.' + stepId, { priority: next || null });
  const stepEl = document.querySelector(`[data-step-id="${stepId}"]`);
  if (stepEl) {
    ['prio-none','prio-rood','prio-oranje','prio-groen'].forEach(c => stepEl.classList.remove(c));
    stepEl.classList.add('prio-' + (next || 'none'));
    const flagBtn = stepEl.querySelector('.prio-flag');
    if (flagBtn) {
      ['prio-none','prio-rood','prio-oranje','prio-groen'].forEach(c => flagBtn.classList.remove(c));
      flagBtn.classList.add('prio-' + (next || 'none'));
      flagBtn.setAttribute('onclick', `cyclePriority('${projectId}','${stepId}','${next}')`);
    }
  }
}

function setupDragDrop(listEl) {
  if (!listEl || listEl.__dragWired) return;
  listEl.__dragWired = true;
  let draggedId = null;
  listEl.addEventListener('dragstart', (e) => {
    if (!isLoggedIn) { e.preventDefault(); return; }
    const stepEl = e.target.closest('.step');
    if (!stepEl) return;
    draggedId = stepEl.dataset.stepId;
    stepEl.classList.add('dragging');
  });
  listEl.addEventListener('dragend', (e) => {
    const stepEl = e.target.closest('.step');
    if (stepEl) stepEl.classList.remove('dragging');
    listEl.querySelectorAll('.step').forEach(s => s.classList.remove('drag-over'));
  });
  listEl.addEventListener('dragover', (e) => {
    const stepEl = e.target.closest('.step');
    if (!stepEl) return;
    e.preventDefault();
    stepEl.classList.add('drag-over');
  });
  listEl.addEventListener('dragleave', (e) => {
    const stepEl = e.target.closest('.step');
    if (stepEl) stepEl.classList.remove('drag-over');
  });
  listEl.addEventListener('drop', async (e) => {
    const stepEl = e.target.closest('.step');
    if (!stepEl) return;
    e.preventDefault(); stepEl.classList.remove('drag-over');
    const targetId = stepEl.dataset.stepId;
    if (!draggedId || draggedId === targetId) return;
    const items = Array.from(listEl.querySelectorAll('.step'));
    const draggedEl = items.find(i => i.dataset.stepId === draggedId);
    if (!draggedEl) return;
    const targetIdx = items.indexOf(stepEl);
    listEl.insertBefore(draggedEl, items.indexOf(draggedEl) < targetIdx ? stepEl.nextSibling : stepEl);
    const orderedIds = Array.from(listEl.querySelectorAll('.step')).map(s => s.dataset.stepId);
    const projectId = listEl.dataset.project;
    try {
      for (let i = 0; i < orderedIds.length; i++) await sbUpdate('team_project_steps', 'id=eq.' + orderedIds[i], { order_num: i+1 });
      refreshProjectView(projectId);
    } catch (err) { alert('Herordenen mislukt: ' + err.message); refreshProjectView(projectId); }
  });
}

  let nmColor = COLOR_PALETTE[0];
  document.querySelectorAll('#nmColorRow .color-swatch').forEach(sw => {
    sw.onclick = () => { document.querySelectorAll('#nmColorRow .color-swatch').forEach(s2=>s2.classList.remove('selected')); sw.classList.add('selected'); nmColor = sw.dataset.color; };
  });
  document.getElementById('modalCancel').onclick = closeModal;
  document.getElementById('modalAddMember').onclick = async () => {
    const name = document.getElementById('nmName').value.trim();
    const email = document.getElementById('nmEmail').value.trim().toLowerCase();
    const isMod = document.getElementById('nmMod').checked;
    if (!name || !email) { alert('Naam en e-mailadres zijn verplicht.'); return; }
    const btn = document.getElementById('modalAddMember');
    btn.disabled = true; btn.textContent = 'Bezig\u2026';
    try {
      await sbInsert('team_members', [{ email, name, color: nmColor, is_moderator: isMod }]);
      notifyNewMember(email, name);
      await loadTeamMembers();
      renderTeamSettingsModal();
    } catch (e) {
      alert('Toevoegen mislukt: ' + e.message);
      btn.disabled = false; btn.textContent = 'Lid toevoegen';
    }
  };
}
function editMemberColor(email) {
  const m = memberByEmail(email);
  if (!m) return;
  renderModal(`
    <h2>Kleur aanpassen</h2>
    <div class="field"><label>${escapeHtml(m.name)}</label><div class="color-swatch-row" id="ecColorRow">${COLOR_PALETTE.map(c => `<div class="color-swatch ${c===m.color?'selected':''}" style="background:${c}" data-color="${c}"></div>`).join('')}</div></div>
    <div class="modal-actions"><button class="ghost" id="modalCancel">Annuleren</button><button class="primary" id="modalSave">Opslaan</button></div>
  `);
  let newColor = m.color;
  document.querySelectorAll('#ecColorRow .color-swatch').forEach(sw => {
    sw.onclick = () => { document.querySelectorAll('#ecColorRow .color-swatch').forEach(s2=>s2.classList.remove('selected')); sw.classList.add('selected'); newColor = sw.dataset.color; };
  });
  document.getElementById('modalCancel').onclick = renderTeamSettingsModal;
  document.getElementById('modalSave').onclick = async () => {
    try {
      await sbUpdate('team_members', 'email=eq.' + encodeURIComponent(email), { color: newColor });
      await loadTeamMembers();
      renderTeamSettingsModal();
    } catch (e) { alert('Opslaan mislukt: ' + e.message); }
  };
}
async function removeMemberUI(email) {
  if (email === currentUserEmail) return;
  const m = memberByEmail(email);
  if (!m) return;
  if (!confirm(`${m.name} verwijderen uit het team? Deze persoon kan dan niet meer inloggen of bewerken.`)) return;
  try {
    await sbDelete('team_members', 'email=eq.' + encodeURIComponent(email));
    await loadTeamMembers();
    renderTeamSettingsModal();
  } catch (e) { alert('Verwijderen mislukt: ' + e.message); }
}

// ================= Routing =================
function parseRouteFromUrl() {
  const params = new URLSearchParams(window.location.search);
  if (params.get('share')) return { view: 'shared', id: params.get('share') };
  if (params.get('project')) return { view: 'project', id: params.get('project') };
  return { view: 'home' };
}
window.addEventListener('popstate', (e) => {
  const route = e.state || parseRouteFromUrl();
  if (route.view === 'project' && route.id) openProject(route.id, false, true);
  else goHome();
});

document.getElementById('authBtn').onclick = handleAuthClick;
document.getElementById('newProjectBtn').onclick = showNewProjectModal;
document.getElementById('homeLink').onclick = () => goHome();
document.getElementById('settingsBtn').onclick = showTeamSettingsModal;
document.getElementById('archiveBtn').onclick = loadArchive;
document.getElementById('viewPrefsBtn').onclick = showViewPrefsModal;

const __initialRoute = parseRouteFromUrl();
if (__initialRoute.view === 'shared') {
  document.getElementById('newProjectBtn').style.display = 'none';
  document.getElementById('authBtn').style.display = 'none';
  document.getElementById('homeLink').style.cursor = 'default';
  document.getElementById('homeLink').onclick = null;
  history.replaceState({ view: 'shared', id: __initialRoute.id }, '');
  loadTeamMembers().then(() => openProject(__initialRoute.id, true));
} else if (__initialRoute.view === 'project') {
  history.replaceState({ view: 'project', id: __initialRoute.id }, '');
  initAuthState().then(() => openProject(__initialRoute.id, false, true));
} else {
  history.replaceState({ view: 'home' }, '');
  initAuthState().then(() => loadHome());
}
</script>
